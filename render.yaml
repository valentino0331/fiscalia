services:
  - type: static
    name: hardman-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /
        destination: /info/index.html
      - type: rewrite
        source: /info
        destination: /info/index.html
      - type: rewrite
        source: /info/*
        destination: /info/*
      - type: redirect
        source: /landing
        destination: /
      - type: rewrite
        source: /*
        destination: /index.html

